name: Direct Combo UI Refinement

on:
  push:
    branches:
      - fix/combo-ui-refinement-direct

permissions:
  contents: write

jobs:
  patch-and-validate:
    if: ${{ !contains(github.event.head_commit.message, '[combo-ui-patched]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/combo-ui-refinement-direct
          fetch-depth: 0

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply scoped Combo UI patch
        run: python3 scripts/apply_combo_ui_refinement.py

      - name: Install dependencies
        run: npm ci

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Diff check
        run: git diff --check

      - name: Install Playwright Chromium
        shell: bash
        run: |
          for apt_source in /etc/apt/sources.list.d/*; do
            if [ -f "$apt_source" ] && grep -q "dl.google.com" "$apt_source"; then
              sudo mv "$apt_source" "$apt_source.disabled"
            fi
          done
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          npx playwright install --with-deps chromium

      - name: Create local test secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          META_PAGE_ACCESS_TOKEN=ci-page-token
          META_APP_SECRET=ci-meta-app-secret
          META_WEBHOOK_VERIFY_TOKEN=ci-webhook-token
          CART_SHARE_SECRET=ci-cart-share-secret-0123456789abcdef
          STOREFRONT_ACCESS_SECRET=ci-storefront-access-secret-0123456789abcdef
          EOF

      - name: Start development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/babyjoy-combo-ui.log 2>&1 &
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/babyjoy-combo-ui.log
          exit 1

      - name: Targeted Combo browser E2E
        id: combo_e2e
        continue-on-error: true
        env:
          BABYJOY_BASE_URL: http://127.0.0.1:5173
        shell: bash
        run: |
          set -o pipefail
          npm run test:e2e:combo 2>&1 | tee combo-ui-e2e.log

      - name: Upload Combo E2E diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: combo-ui-e2e-diagnostics
          path: |
            combo-ui-e2e.log
            /tmp/babyjoy-combo-ui.log
          if-no-files-found: warn

      - name: Fail on targeted E2E failure
        if: steps.combo_e2e.outcome == 'failure'
        run: exit 1

      - name: Commit validated source changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/components/combo-admin-pages.tsx app/components/public-pages.tsx app/combo.css shared/combos.ts tests/combo-ui-refinement.test.ts tests/combo-hard-delete.e2e.mjs
          git commit -m "fix: refine combo admin and storefront UI [combo-ui-patched]"
          git push origin HEAD:fix/combo-ui-refinement-direct
