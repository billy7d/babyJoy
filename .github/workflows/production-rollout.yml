name: Production Rollout

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rollout step to run"
        required: true
        default: prepare
        type: choice
        options:
          - prepare
          - enable_gate
          - repair_cron
      confirm_enable_gate:
        description: "Type ENABLE when mode=enable_gate"
        required: false
        default: ""
        type: string
      confirm_repair_cron:
        description: "Type REPAIR_CRON when mode=repair_cron"
        required: false
        default: ""
        type: string
  push:
    branches:
      - "rollout/prepare/**"
      - "rollout/enable/**"

concurrency:
  group: production-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  rollout:
    name: Production rollout
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PRODUCTION_WORKER_SCRIPT_NAME: babyjoy-web-app-production

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve rollout mode
        id: rollout_mode
        shell: bash
        env:
          DISPATCH_MODE: ${{ inputs.mode }}
        run: |
          set -euo pipefail
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            mode="$DISPATCH_MODE"
          elif [[ "$GITHUB_REF_NAME" == rollout/prepare/* ]]; then
            mode="prepare"
          elif [[ "$GITHUB_REF_NAME" == rollout/enable/* ]]; then
            mode="enable_gate"
          else
            echo "Unsupported production rollout trigger: $GITHUB_EVENT_NAME / $GITHUB_REF_NAME" >&2
            exit 1
          fi
          if [ "$mode" != "prepare" ] && [ "$mode" != "enable_gate" ] && [ "$mode" != "repair_cron" ]; then
            echo "Unsupported rollout mode: $mode" >&2
            exit 1
          fi
          echo "value=$mode" >> "$GITHUB_OUTPUT"
          echo "Resolved production rollout mode: $mode"

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate production Cloudflare credentials
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "Missing GitHub production environment secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          fi
          if [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "Missing GitHub production environment secret: CLOUDFLARE_ACCOUNT_ID" >&2
            exit 1
          fi
          if [[ ! "$CLOUDFLARE_ACCOUNT_ID" =~ ^[[:xdigit:]]{32}$ ]]; then
            echo "CLOUDFLARE_ACCOUNT_ID must be a 32-character hexadecimal Cloudflare account ID." >&2
            exit 1
          fi
          echo "Using the explicitly configured GitHub production account; local Wrangler account discovery is not used."

      - name: Validate manual enable confirmation
        if: ${{ steps.rollout_mode.outputs.value == 'enable_gate' && github.event_name == 'workflow_dispatch' }}
        shell: bash
        env:
          CONFIRM_ENABLE_GATE: ${{ inputs.confirm_enable_gate }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_ENABLE_GATE" != "ENABLE" ]; then
            echo "To enable the production storefront gate, set confirm_enable_gate to ENABLE." >&2
            exit 1
          fi

      - name: Validate manual Cron repair confirmation
        if: ${{ steps.rollout_mode.outputs.value == 'repair_cron' }}
        shell: bash
        env:
          CONFIRM_REPAIR_CRON: ${{ inputs.confirm_repair_cron }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_REPAIR_CRON" != "REPAIR_CRON" ]; then
            echo "To repair production Cron, set confirm_repair_cron to REPAIR_CRON." >&2
            exit 1
          fi

      - name: Extract canonical production deployment contract
        id: deployment_contract
        shell: bash
        run: |
          set -euo pipefail
          expected_file="$RUNNER_TEMP/babyjoy-production-crons.json"
          metadata_file="$RUNNER_TEMP/babyjoy-production-metadata.json"
          config_path="wrangler.jsonc"
          node scripts/cloudflare-production-cron.mjs extract \
            --config "$config_path" \
            --environment production \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --output "$expected_file" \
            --metadata-output "$metadata_file"
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const metadata = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/babyjoy-production-metadata.json', 'utf8'));
          if (metadata.scriptName !== process.env.PRODUCTION_WORKER_SCRIPT_NAME) {
            throw new Error(`Resolved Worker script ${metadata.scriptName} does not match the verified production script name.`);
          }
          if (metadata.workersDev !== false || metadata.previewUrls !== false) {
            throw new Error('Production deployment contract must keep workers.dev and preview URLs disabled.');
          }
          if (metadata.customDomain !== 'metraphuong.com') {
            throw new Error(`Resolved custom domain ${metadata.customDomain} does not match metraphuong.com.`);
          }
          console.log(`Resolved production Worker: ${metadata.scriptName}`);
          console.log(`Canonical production Cron: ${JSON.stringify(metadata.crons)}`);
          console.log(`Canonical custom domain: ${metadata.customDomain}`);
          NODE
          echo "config_path=$config_path" >> "$GITHUB_OUTPUT"
          echo "expected_file=$expected_file" >> "$GITHUB_OUTPUT"
          echo "metadata_file=$metadata_file" >> "$GITHUB_OUTPUT"

      - name: Cron API read preflight
        id: cron_preflight
        shell: bash
        run: |
          set -euo pipefail
          set +e
          node scripts/cloudflare-production-cron.mjs check \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --expected-file "$RUNNER_TEMP/babyjoy-production-crons.json" \
            --state-output "$RUNNER_TEMP/babyjoy-cron-before.json"
          check_status=$?
          set -e
          if [ "$check_status" -eq 0 ]; then
            echo "Cron API preflight passed: current schedules exactly match canonical state."
          elif [ "$check_status" -eq 2 ]; then
            echo "Cron API preflight passed: API is reachable, but schedules need reconciliation."
          else
            echo "Cron API preflight failed; production operations are blocked." >&2
            exit "$check_status"
          fi

      - name: Install dependencies
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        run: npm ci

      - name: Run quality checks
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run build

      - name: Apply production D1 migrations
        if: ${{ steps.rollout_mode.outputs.value == 'prepare' }}
        run: npx wrangler d1 migrations apply babyjoy-db --remote --env production

      - name: Initialize storefront access secret if missing
        if: ${{ steps.rollout_mode.outputs.value == 'prepare' }}
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler secret list --env production --format json > /tmp/worker-secrets.json
          if node -e '
            const fs = require("fs");
            const rows = JSON.parse(fs.readFileSync("/tmp/worker-secrets.json", "utf8"));
            process.exit(Array.isArray(rows) && rows.some((row) => row.name === "STOREFRONT_ACCESS_SECRET") ? 0 : 1);
          '; then
            echo "STOREFRONT_ACCESS_SECRET already exists; leaving it unchanged."
          else
            echo "STOREFRONT_ACCESS_SECRET is missing; generating it once."
            openssl rand -hex 32 | npx wrangler secret put STOREFRONT_ACCESS_SECRET --env production
          fi
          rm -f /tmp/worker-secrets.json

      - name: Force gate disabled for prepare deploy
        if: ${{ steps.rollout_mode.outputs.value == 'prepare' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replaceAll(
            '"STOREFRONT_ACCESS_GATE_ENABLED": "true"',
            '"STOREFRONT_ACCESS_GATE_ENABLED": "false"',
          );
          fs.writeFileSync(path, content);
          NODE

      - name: Enable gate in deployment config
        if: ${{ steps.rollout_mode.outputs.value == 'enable_gate' }}
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('"STOREFRONT_ACCESS_GATE_ENABLED": "false"')) {
            throw new Error('Could not locate STOREFRONT_ACCESS_GATE_ENABLED=false in wrangler.jsonc');
          }
          content = content.replaceAll(
            '"STOREFRONT_ACCESS_GATE_ENABLED": "false"',
            '"STOREFRONT_ACCESS_GATE_ENABLED": "true"',
          );
          fs.writeFileSync(path, content);
          NODE

      - name: Build resolved production deployment config
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        shell: bash
        env:
          ROLLOUT_MODE: ${{ steps.rollout_mode.outputs.value }}
        run: |
          set -euo pipefail
          npm run build
          test -s build/server/wrangler.json
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const config = JSON.parse(fs.readFileSync('build/server/wrangler.json', 'utf8'));
          const value = config.vars?.STOREFRONT_ACCESS_GATE_ENABLED;
          const expected = process.env.ROLLOUT_MODE === 'prepare' ? 'false' : 'true';
          console.log(`Generated deployment gate flag: ${value}; expected: ${expected}`);
          if (value !== expected) {
            throw new Error('Generated deployment config has an unexpected storefront gate flag.');
          }
          NODE

      - name: Create trigger-free Worker deployment config
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        shell: bash
        run: |
          set -euo pipefail
          node scripts/cloudflare-production-cron.mjs prepare-deploy-config \
            --input build/server/wrangler.json \
            --output build/server/wrangler.production-deploy.json \
            --expected-file "$RUNNER_TEMP/babyjoy-production-crons.json"
          test -s build/server/wrangler.production-deploy.json

      - name: Verify production Worker before Cron repair
        if: ${{ steps.rollout_mode.outputs.value == 'repair_cron' }}
        run: |
          node scripts/cloudflare-production-cron.mjs worker-state \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --metadata-file "$RUNNER_TEMP/babyjoy-production-metadata.json" \
            --state-output "$RUNNER_TEMP/babyjoy-worker-before.json"

      - name: Validate trigger-free Wrangler deployment (dry run)
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        run: npx wrangler deploy --dry-run --config build/server/wrangler.production-deploy.json

      - name: Deploy production Worker
        id: worker_deploy
        if: ${{ steps.rollout_mode.outputs.value != 'repair_cron' }}
        run: npx wrangler deploy --config build/server/wrangler.production-deploy.json

      - name: Reconcile production Cron
        id: cron_reconcile
        run: |
          node scripts/cloudflare-production-cron.mjs reconcile \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --expected-file "$RUNNER_TEMP/babyjoy-production-crons.json" \
            --state-output "$RUNNER_TEMP/babyjoy-cron-reconcile.json"

      - name: Verify production Cron exact state
        id: cron_verify
        run: |
          node scripts/cloudflare-production-cron.mjs check \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --expected-file "$RUNNER_TEMP/babyjoy-production-crons.json" \
            --state-output "$RUNNER_TEMP/babyjoy-cron-after.json"

      - name: Verify production Worker routing and deployment state
        id: worker_verify
        run: |
          node scripts/cloudflare-production-cron.mjs worker-state \
            --script-name "$PRODUCTION_WORKER_SCRIPT_NAME" \
            --metadata-file "$RUNNER_TEMP/babyjoy-production-metadata.json" \
            --state-output "$RUNNER_TEMP/babyjoy-worker-after.json"

      - name: Verify Cron repair did not change Worker version
        id: repair_version_verify
        if: ${{ steps.rollout_mode.outputs.value == 'repair_cron' }}
        run: |
          node scripts/cloudflare-production-cron.mjs assert-version-unchanged \
            --before "$RUNNER_TEMP/babyjoy-worker-before.json" \
            --after "$RUNNER_TEMP/babyjoy-worker-after.json"

      - name: Smoke test gate disabled
        id: smoke_prepare
        if: ${{ steps.rollout_mode.outputs.value == 'prepare' }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 12 ]; then return 1; fi
              sleep 5
            done
          }
          retry bash -c 'status=$(curl -sS -o /tmp/home.html -w "%{http_code}" https://metraphuong.com/); test "$status" = "200"'
          retry bash -c 'status=$(curl -sS -o /tmp/products.json -w "%{http_code}" https://metraphuong.com/api/products); test "$status" = "200"'
          if grep -q "STOREFRONT_SESSION_REQUIRED" /tmp/products.json; then
            echo "Public catalog API unexpectedly requires a storefront session while gate should be disabled." >&2
            exit 1
          fi
          echo "Prepare smoke passed: homepage and public products API are reachable with gate disabled."

      - name: Smoke test gate enabled
        id: smoke_enable
        if: ${{ steps.rollout_mode.outputs.value == 'enable_gate' }}
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              if [ "$attempts" -ge 12 ]; then return 1; fi
              sleep 5
            done
          }
          retry bash -c 'status=$(curl -sS -o /tmp/products.json -w "%{http_code}" https://metraphuong.com/api/products); test "$status" = "401"'
          grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/products.json
          retry bash -c 'status=$(curl -sS -L -o /tmp/access-required.html -w "%{http_code}" https://metraphuong.com/access-required); test "$status" = "200"'
          curl -sS -o /tmp/admin.html -w "%{http_code}" https://metraphuong.com/admin/ > /tmp/admin-status.txt
          if grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/admin.html 2>/dev/null; then
            echo "Admin route was incorrectly captured by storefront gating." >&2
            exit 1
          fi
          echo "Gate-enabled smoke passed: public catalog API is gated and access-required remains reachable."

      - name: Write production rollout summary
        if: ${{ always() }}
        shell: bash
        env:
          ROLLOUT_MODE: ${{ steps.rollout_mode.outputs.value }}
          WORKER_DEPLOY_OUTCOME: ${{ steps.worker_deploy.outcome }}
          CRON_RECONCILE_OUTCOME: ${{ steps.cron_reconcile.outcome }}
          CRON_VERIFY_OUTCOME: ${{ steps.cron_verify.outcome }}
          WORKER_VERIFY_OUTCOME: ${{ steps.worker_verify.outcome }}
          SMOKE_PREPARE_OUTCOME: ${{ steps.smoke_prepare.outcome }}
          SMOKE_ENABLE_OUTCOME: ${{ steps.smoke_enable.outcome }}
        run: |
          set -euo pipefail
          read_json_field() {
            local path="$1"
            local field="$2"
            if [ ! -f "$path" ]; then
              echo "unavailable"
              return 0
            fi
            node -e '
              const fs = require("fs");
              const [path, field] = process.argv.slice(1);
              const value = JSON.parse(fs.readFileSync(path, "utf8"));
              const selected = value[field];
              process.stdout.write(typeof selected === "string" ? selected : JSON.stringify(selected ?? "unavailable"));
            ' "$path" "$field"
          }
          expected_cron="unavailable"
          if [ -f "$RUNNER_TEMP/babyjoy-production-crons.json" ]; then
            expected_cron="$(node -e 'const fs = require("fs"); process.stdout.write(JSON.stringify(JSON.parse(fs.readFileSync(process.argv[1], "utf8"))));' "$RUNNER_TEMP/babyjoy-production-crons.json")"
          fi
          cron_before="$(read_json_field "$RUNNER_TEMP/babyjoy-cron-before.json" actualCrons)"
          cron_after="$(read_json_field "$RUNNER_TEMP/babyjoy-cron-after.json" actualCrons)"
          cron_operation="$(read_json_field "$RUNNER_TEMP/babyjoy-cron-reconcile.json" operation)"
          custom_domain="$(read_json_field "$RUNNER_TEMP/babyjoy-production-metadata.json" customDomain)"
          worker_deploy_status="NOT RUN"
          if [ "${WORKER_DEPLOY_OUTCOME:-}" = "success" ]; then worker_deploy_status="SUCCESS"; fi
          if [ "${WORKER_DEPLOY_OUTCOME:-}" = "failure" ]; then worker_deploy_status="FAILED"; fi
          cron_status="NOT RUN"
          if [ "${CRON_RECONCILE_OUTCOME:-}" = "success" ]; then cron_status="${cron_operation}"; fi
          if [ "${CRON_RECONCILE_OUTCOME:-}" = "failure" ]; then cron_status="FAILED"; fi
          if [ "${CRON_VERIFY_OUTCOME:-}" = "failure" ]; then cron_status="FAILED"; fi
          smoke_status="NOT RUN"
          if [ "${ROLLOUT_MODE:-}" = "prepare" ]; then smoke_status="${SMOKE_PREPARE_OUTCOME:-NOT RUN}"; fi
          if [ "${ROLLOUT_MODE:-}" = "enable_gate" ]; then smoke_status="${SMOKE_ENABLE_OUTCOME:-NOT RUN}"; fi
          workers_dev_status="UNKNOWN"
          worker_after="$RUNNER_TEMP/babyjoy-worker-after.json"
          if [ -f "$worker_after" ]; then
            workers_dev_status="$(read_json_field "$worker_after" workersDev)"
            if [ "$workers_dev_status" = "false" ]; then workers_dev_status="disabled"; fi
          fi
          {
            echo "## Production Rollout Summary"
            echo
            echo "Mode: ${ROLLOUT_MODE:-unknown}"
            echo
            echo "Worker: $PRODUCTION_WORKER_SCRIPT_NAME"
            echo
            echo "Worker deploy: $worker_deploy_status"
            echo
            echo "Expected cron: $expected_cron"
            echo
            echo "Cron before: $cron_before"
            echo
            echo "Cron reconciliation: $cron_status"
            echo
            echo "Cron after: $cron_after"
            echo
            echo "workers.dev: $workers_dev_status"
            echo
            echo "Custom domain: ${custom_domain:-unknown}"
            echo
            echo "Smoke tests: $smoke_status"
            echo
            echo "Cron verification step: ${CRON_VERIFY_OUTCOME:-NOT RUN}"
            echo
            echo "Worker verification step: ${WORKER_VERIFY_OUTCOME:-NOT RUN}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$worker_deploy_status" = "SUCCESS" ] && [ "$cron_status" = "FAILED" ]; then
            echo >> "$GITHUB_STEP_SUMMARY"
            echo "⚠ Worker deployment succeeded, but Cron reconciliation failed. Production requires operator attention." >> "$GITHUB_STEP_SUMMARY"
          fi
