name: Production Enable Smoke

on:
  push:
    branches:
      - "rollout/smoke-enable/**"

concurrency:
  group: production-rollout
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  enable-smoke:
    name: Enable gate with access smoke
    runs-on: ubuntu-24.04
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      STOREFRONT_ACCESS_SECRET: ${{ secrets.STOREFRONT_ACCESS_SECRET }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Validate Cloudflare API token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${CLOUDFLARE_API_TOKEN:-}" || {
            echo "Missing GitHub environment secret: CLOUDFLARE_API_TOKEN" >&2
            exit 1
          }

      - name: Validate storefront smoke secret
        shell: bash
        run: |
          set -euo pipefail
          test -n "${STOREFRONT_ACCESS_SECRET:-}" || {
            echo "Missing GitHub environment secret: STOREFRONT_ACCESS_SECRET" >&2
            exit 1
          }

      - name: Install dependencies
        run: npm ci

      - name: Resolve Cloudflare account
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            exit 0
          fi
          npx wrangler whoami --json > /tmp/cloudflare-whoami.json
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('/tmp/cloudflare-whoami.json', 'utf8'));
          const accounts = Array.isArray(data.accounts) ? data.accounts : [];
          if (accounts.length !== 1 || !accounts[0]?.id) {
            console.error(`Expected exactly one Cloudflare account, found ${accounts.length}.`);
            process.exit(1);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `CLOUDFLARE_ACCOUNT_ID=${accounts[0].id}\n`);
          NODE
          rm -f /tmp/cloudflare-whoami.json

      - name: Run quality checks
        shell: bash
        run: |
          set -euo pipefail
          npm test
          npm run typecheck
          npm run build

      - name: Verify access tables are empty
        shell: bash
        run: |
          set -euo pipefail
          npx wrangler d1 execute babyjoy-db --remote --env production \
            --command "SELECT (SELECT COUNT(*) FROM access_links) AS links, (SELECT COUNT(*) FROM access_sessions) AS sessions;" \
            --json > /tmp/access-counts.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/access-counts.json', 'utf8'));
          const rows = Array.isArray(payload) ? payload.flatMap((entry) => entry?.results ?? []) : [];
          const row = rows.find((value) => Number.isFinite(Number(value?.links)) && Number.isFinite(Number(value?.sessions)));
          if (!row) {
            console.error('Could not read production access table counts.');
            process.exit(1);
          }
          const links = Number(row.links);
          const sessions = Number(row.sessions);
          if (links !== 0 || sessions !== 0) {
            console.error(`Refusing bootstrap: found ${links} links and ${sessions} sessions.`);
            process.exit(1);
          }
          NODE
          rm -f /tmp/access-counts.json

      - name: Create temporary production access credential
        shell: bash
        run: |
          set -euo pipefail
          # Use the already configured production signing secret. This smoke
          # workflow must never rotate it, because existing access URLs depend
          # on that secret.
          smoke_secret="${STOREFRONT_ACCESS_SECRET}"
          echo "::add-mask::$smoke_secret"
          smoke_link_id="$(node -e "console.log(require('crypto').randomUUID())")"
          smoke_signature="$(
            SMOKE_SECRET="$smoke_secret" SMOKE_LINK_ID="$smoke_link_id" node <<'NODE'
          const crypto = require('crypto');
          const input = `storefront-access:v1:${process.env.SMOKE_LINK_ID}:1`;
          process.stdout.write(crypto.createHmac('sha256', process.env.SMOKE_SECRET).update(input).digest('base64url'));
          NODE
          )"
          smoke_credential="${smoke_link_id}.${smoke_signature}"
          echo "::add-mask::$smoke_credential"

          now="$(date -u +"%Y-%m-%dT%H:%M:%S.000Z")"
          npx wrangler d1 execute babyjoy-db --remote --env production \
            --command "INSERT INTO access_links (id, name, notes, status, version, session_ttl_seconds, created_by_email, updated_by_email, created_at, updated_at) VALUES ('$smoke_link_id', '__production_smoke__', 'Automated production rollout smoke', 'ACTIVE', 1, 3600, 'github-actions@metraphuong.com', 'github-actions@metraphuong.com', '$now', '$now');"
          echo "SMOKE_LINK_ID=$smoke_link_id" >> "$GITHUB_ENV"
          echo "SMOKE_ACCESS_CREDENTIAL=$smoke_credential" >> "$GITHUB_ENV"

      - name: Enable gate and rebuild deployment config
        id: enable_config
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let content = fs.readFileSync(path, 'utf8');
          if (!content.includes('"STOREFRONT_ACCESS_GATE_ENABLED": "false"')) {
            throw new Error('Could not locate storefront gate=false in wrangler.jsonc');
          }
          content = content.replaceAll(
            '"STOREFRONT_ACCESS_GATE_ENABLED": "false"',
            '"STOREFRONT_ACCESS_GATE_ENABLED": "true"',
          );
          fs.writeFileSync(path, content);
          NODE
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('build/server/wrangler.json', 'utf8'));
          const value = config.vars?.STOREFRONT_ACCESS_GATE_ENABLED
            ?? config.env?.production?.vars?.STOREFRONT_ACCESS_GATE_ENABLED;
          console.log(`Generated deployment gate flag: ${value}`);
          if (value !== 'true') process.exit(1);
          NODE

      - name: Deploy production Worker with gate enabled
        run: npx wrangler deploy --env production

      - name: End-to-end storefront access smoke
        shell: bash
        run: |
          set -euo pipefail
          retry() {
            local attempts=0
            until "$@"; do
              attempts=$((attempts + 1))
              [ "$attempts" -lt 12 ] || return 1
              sleep 5
            done
          }

          retry bash -c 'status=$(curl -sS -o /tmp/products-no-session.json -w "%{http_code}" https://metraphuong.com/api/products); test "$status" = "401"'
          grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/products-no-session.json

          status="$(curl -sS -D /tmp/access.headers -o /tmp/access.body -c /tmp/access.cookies -w "%{http_code}" "https://metraphuong.com/access/${SMOKE_ACCESS_CREDENTIAL}")"
          test "$status" = "303"
          tr -d '\r' < /tmp/access.headers | grep -qi '^location: /$'

          retry bash -c 'status=$(curl -sS -b /tmp/access.cookies -o /tmp/products-with-session.json -w "%{http_code}" https://metraphuong.com/api/products); test "$status" = "200"'
          ! grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/products-with-session.json

          status="$(curl -sS -D /tmp/home.headers -o /tmp/home-gated.html -w "%{http_code}" https://metraphuong.com/)"
          test "$status" = "303"
          tr -d '\r' < /tmp/home.headers | grep -qi '^location: /access-required$'
          retry bash -c 'status=$(curl -sS -L -o /tmp/access-required.html -w "%{http_code}" https://metraphuong.com/access-required); test "$status" = "200"'

          curl -sS -o /tmp/admin.html https://metraphuong.com/admin/ || true
          ! grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/admin.html 2>/dev/null
          curl -sS -o /tmp/webhook.html "https://metraphuong.com/api/meta/messenger/webhook?hub.mode=subscribe&hub.verify_token=invalid&hub.challenge=smoke" || true
          ! grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/webhook.html 2>/dev/null
          curl -sS -o /tmp/cart-share.html https://metraphuong.com/c/nonexistent-production-smoke || true
          ! grep -q 'STOREFRONT_SESSION_REQUIRED' /tmp/cart-share.html 2>/dev/null

          echo "Production access smoke passed."

      - name: Cleanup temporary access data
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${SMOKE_LINK_ID:-}" ]; then
            exit 0
          fi
          npx wrangler d1 execute babyjoy-db --remote --env production \
            --command "DELETE FROM access_link_events WHERE access_link_id = '$SMOKE_LINK_ID'; DELETE FROM access_sessions WHERE access_link_id = '$SMOKE_LINK_ID'; DELETE FROM access_link_groups WHERE access_link_id = '$SMOKE_LINK_ID'; DELETE FROM access_links WHERE id = '$SMOKE_LINK_ID';"
          npx wrangler d1 execute babyjoy-db --remote --env production \
            --command "SELECT COUNT(*) AS remaining FROM access_links WHERE id = '$SMOKE_LINK_ID';" \
            --json > /tmp/smoke-cleanup.json
          node <<'NODE'
          const fs = require('fs');
          const payload = JSON.parse(fs.readFileSync('/tmp/smoke-cleanup.json', 'utf8'));
          const rows = Array.isArray(payload) ? payload.flatMap((entry) => entry?.results ?? []) : [];
          const row = rows.find((value) => Number.isFinite(Number(value?.remaining)));
          if (!row || Number(row.remaining) !== 0) process.exit(1);
          NODE

      - name: Roll back gate after any enable failure
        if: ${{ failure() && steps.enable_config.outcome == 'success' }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Enable smoke failed; rebuilding and redeploying with gate OFF."
          node <<'NODE'
          const fs = require('fs');
          const path = 'wrangler.jsonc';
          let content = fs.readFileSync(path, 'utf8');
          content = content.replaceAll(
            '"STOREFRONT_ACCESS_GATE_ENABLED": "true"',
            '"STOREFRONT_ACCESS_GATE_ENABLED": "false"',
          );
          fs.writeFileSync(path, content);
          NODE
          npm run build
          node <<'NODE'
          const fs = require('fs');
          const config = JSON.parse(fs.readFileSync('build/server/wrangler.json', 'utf8'));
          const value = config.vars?.STOREFRONT_ACCESS_GATE_ENABLED
            ?? config.env?.production?.vars?.STOREFRONT_ACCESS_GATE_ENABLED;
          console.log(`Generated rollback gate flag: ${value}`);
          if (value !== 'false') process.exit(1);
          NODE
          npx wrangler deploy --env production
