name: CI

on:
  pull_request:
  push:
    branches:
      - main

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Unit tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  e2e:
    name: E2E (Chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Create CI local secrets
        shell: bash
        run: |
          cat > .dev.vars <<'EOF'
          META_PAGE_ACCESS_TOKEN=ci-page-token
          META_APP_SECRET=ci-meta-app-secret
          META_WEBHOOK_VERIFY_TOKEN=ci-webhook-token
          CART_SHARE_SECRET=ci-cart-share-secret-0123456789abcdef
          STOREFRONT_ACCESS_SECRET=ci-storefront-access-secret-0123456789abcdef
          EOF

      - name: Apply local D1 migrations
        run: npm run db:migrate:local

      - name: Start development server
        shell: bash
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/babyjoy-dev.log 2>&1 &
          echo $! > /tmp/babyjoy-dev.pid
          for attempt in {1..60}; do
            if curl --fail --silent --show-error http://127.0.0.1:5173/ >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          echo "Development server did not become ready"
          cat /tmp/babyjoy-dev.log
          exit 1

      - name: Browser E2E
        env:
          BABYJOY_BASE_URL: http://127.0.0.1:5173
        run: |
          npm run test:e2e
          npm run test:e2e:rich-description

      - name: Show server log on failure
        if: failure()
        run: cat /tmp/babyjoy-dev.log || true

      - name: Upload E2E screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: screenshots/actual/
          if-no-files-found: ignore
          retention-days: 7
